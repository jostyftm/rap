services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: "${CADDY_MEM_LIMIT:-64m}"
    cpus: "0.5"
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    volumes:
      - "./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "rpa-prod-caddy-data:/data"
      - "rpa-prod-caddy-config:/config"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost}"
        NEXT_PUBLIC_REVERB_APP_KEY: "${NEXT_PUBLIC_REVERB_APP_KEY}"
        NEXT_PUBLIC_REVERB_HOST: "${NEXT_PUBLIC_REVERB_HOST:-localhost}"
        NEXT_PUBLIC_REVERB_PORT: "${NEXT_PUBLIC_REVERB_PORT:-80}"
        NEXT_PUBLIC_REVERB_SCHEME: "${NEXT_PUBLIC_REVERB_SCHEME:-http}"
        NEXT_PUBLIC_LIVE_HOST: "${NEXT_PUBLIC_LIVE_HOST:-}"
        NEXT_PUBLIC_LIVE_PORT: "${NEXT_PUBLIC_LIVE_PORT:-80}"
        NEXT_PUBLIC_S3_URL: "${NEXT_PUBLIC_S3_URL:-}"
    image: rpa-studio/web:prod
    restart: unless-stopped
    mem_limit: "${WEB_MEM_LIMIT:-256m}"
    cpus: "1.0"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=${WEB_NODE_MAX_OLD_SPACE_MB:-256}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: rpa-studio/api:prod
    restart: unless-stopped
    mem_limit: "${API_MEM_LIMIT:-256m}"
    cpus: "1.5"
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-api-storage:/var/www/html/storage"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  reverb:
    image: rpa-studio/api:prod
    restart: unless-stopped
    mem_limit: "${REVERB_MEM_LIMIT:-96m}"
    cpus: "0.5"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  worker:
    image: rpa-studio/api:prod
    profiles:
      - worker
    restart: unless-stopped
    mem_limit: "${WORKER_MEM_LIMIT:-128m}"
    cpus: "0.5"
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-api-storage:/var/www/html/storage"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  events:
    image: rpa-studio/api:prod
    restart: unless-stopped
    mem_limit: "${EVENTS_MEM_LIMIT:-96m}"
    cpus: "0.5"
    command: ["php", "artisan", "rpa:listen-events"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  scheduler:
    image: rpa-studio/api:prod
    restart: unless-stopped
    mem_limit: "${SCHEDULER_MEM_LIMIT:-64m}"
    cpus: "0.25"
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    image: rpa-studio/runner:prod
    restart: unless-stopped
    init: true
    mem_limit: "${RUNNER_MEM_LIMIT:-1800m}"
    cpus: "${RUNNER_CPUS:-4.0}"
    oom_score_adj: 500
    shm_size: "${RUNNER_SHM_SIZE:-128mb}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    environment:
      NODE_OPTIONS: "--max-old-space-size=${RUNNER_NODE_MAX_OLD_SPACE_MB:-384} --max-http-header-size=262144"
      RUNNER_CONCURRENCY: "${RUNNER_CONCURRENCY:-3}"
      RUNNER_AUTO_SCREENSHOTS: "${RUNNER_AUTO_SCREENSHOTS:-false}"
      RUNNER_TRACING: "${RUNNER_TRACING:-on_error}"
      RUNNER_BROWSER_CONSOLE_LOGS: "${RUNNER_BROWSER_CONSOLE_LOGS:-errors}"
      RUNNER_BROWSER_RECYCLE_RUNS: "${RUNNER_BROWSER_RECYCLE_RUNS:-40}"
      RUNNER_LIVE_IDLE_CLOSE_MS: "${RUNNER_LIVE_IDLE_CLOSE_MS:-60000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8085/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal
      - dokploy-network

  pgsql:
    image: postgres:16-alpine
    profiles:
      - local-db
    restart: unless-stopped
    mem_limit: "${PGSQL_MEM_LIMIT:-384m}"
    cpus: "1.5"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=50"
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-${DB_DATABASE:-rpa_studio}}"
      POSTGRES_USER: "${POSTGRES_USER:-${DB_USERNAME:-rpa_user}}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-${DB_PASSWORD:-}}"
    volumes:
      - "rpa-prod-pgsql-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rpa_user} -d ${DB_DATABASE:-rpa_studio}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

  redis:
    image: redis:7-alpine
    profiles:
      - local-redis
    restart: unless-stopped
    mem_limit: "${REDIS_MEM_LIMIT:-160m}"
    cpus: "0.5"
    command:
      [
        "sh",
        "-c",
        "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction",
      ]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-redis-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

  rustfs:
    image: rustfs/rustfs:latest
    profiles:
      - local-s3
    restart: unless-stopped
    mem_limit: "${RUSTFS_MEM_LIMIT:-160m}"
    cpus: "0.5"
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-${S3_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-${S3_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}}"
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-false}"
      RUSTFS_VOLUMES: "${RUSTFS_VOLUMES:-/data}"
    volumes:
      - "rpa-prod-storage-data:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9000/health/live || curl -sf http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

networks:
  rpa-prod-edge:
    driver: bridge
  rpa-prod-internal:
    driver: bridge
    internal: true
  dokploy-network:
    name: "${EXTERNAL_DOCKER_NETWORK:-dokploy-network}"
    external: ${EXTERNAL_DOCKER_NETWORK_IS_EXTERNAL:-true}

volumes:
  rpa-prod-pgsql-data:
    driver: local
  rpa-prod-redis-data:
    driver: local
  rpa-prod-storage-data:
    driver: local
  rpa-prod-api-storage:
    driver: local
  rpa-prod-caddy-data:
    driver: local
  rpa-prod-caddy-config:
    driver: local
