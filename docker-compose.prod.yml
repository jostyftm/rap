services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    volumes:
      - "./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "rpa-prod-caddy-data:/data"
      - "rpa-prod-caddy-config:/config"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost}"
        NEXT_PUBLIC_REVERB_APP_KEY: "${NEXT_PUBLIC_REVERB_APP_KEY}"
        NEXT_PUBLIC_REVERB_HOST: "${NEXT_PUBLIC_REVERB_HOST:-localhost}"
        NEXT_PUBLIC_REVERB_PORT: "${NEXT_PUBLIC_REVERB_PORT:-80}"
        NEXT_PUBLIC_REVERB_SCHEME: "${NEXT_PUBLIC_REVERB_SCHEME:-http}"
        NEXT_PUBLIC_LIVE_HOST: "${NEXT_PUBLIC_LIVE_HOST:-}"
        NEXT_PUBLIC_LIVE_PORT: "${NEXT_PUBLIC_LIVE_PORT:-80}"
        NEXT_PUBLIC_S3_URL: "${NEXT_PUBLIC_S3_URL:-}"
    image: rpa-studio/web:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: rpa-studio/api:prod
    restart: unless-stopped
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-api-storage:/var/www/html/storage"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  reverb:
    image: rpa-studio/api:prod
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  worker:
    image: rpa-studio/api:prod
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-api-storage:/var/www/html/storage"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  events:
    image: rpa-studio/api:prod
    restart: unless-stopped
    command: ["php", "artisan", "rpa:listen-events"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  scheduler:
    image: rpa-studio/api:prod
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    image: rpa-studio/runner:prod
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8085/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - rpa-prod-edge
      - rpa-prod-internal

  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-pgsql-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rpa_user} -d ${DB_DATABASE:-rpa_studio}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-redis-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - "${PROD_ENV_FILE:-.env.prod}"
    volumes:
      - "rpa-prod-storage-data:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9000/health/live || curl -sf http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - rpa-prod-internal

networks:
  rpa-prod-edge:
    driver: bridge
  rpa-prod-internal:
    driver: bridge
    internal: true

volumes:
  rpa-prod-pgsql-data:
    driver: local
  rpa-prod-redis-data:
    driver: local
  rpa-prod-storage-data:
    driver: local
  rpa-prod-api-storage:
    driver: local
  rpa-prod-caddy-data:
    driver: local
  rpa-prod-caddy-config:
    driver: local
