<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RPA Studio — Dashboard de Pruebas</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    .badge { background: #10b981; color: #022c22; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: #1e293b; border-radius: 0.5rem; overflow: hidden; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.875rem; }
    th { background: #334155; color: #94a3b8; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="welcome-message" data-testid="dashboard-title" data-name="welcome-message">Bienvenido al Panel de Automatización</h1>
    <span class="badge" data-testid="session-status">Activo</span>
  </div>

  <table data-testid="orders-table">
    <thead>
      <tr>
        <th>ID Orden</th>
        <th>Cliente</th>
        <th>Estado</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>#1001</td>
        <td data-testid="order-client-1">Acme Corp</td>
        <td>Completado</td>
        <td>$1,250.00</td>
      </tr>
      <tr>
        <td>#1002</td>
        <td data-testid="order-client-2">Globex Inc</td>
        <td>Pendiente</td>
        <td>$840.00</td>
      </tr>
    </tbody>
  </table>

  <div style="margin-top: 1.5rem;">
    <button class="action-btn" id="export-btn" data-testid="export-btn" onclick="alert('Exportando...')">Exportar Reporte</button>
  </div>
</body>
</html>
