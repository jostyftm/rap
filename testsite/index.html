<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RPA Studio — Test Site Login</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 0.75rem; border: 1px solid #334155; width: 340px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; font-size: 1.25rem; }
    label { display: block; font-size: 0.875rem; margin-top: 1rem; color: #94a3b8; }
    input { width: 100%; box-sizing: border-box; padding: 0.6rem; margin-top: 0.3rem; border-radius: 0.375rem; border: 1px solid #475569; background: #0f172a; color: white; }
    button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; border-radius: 0.375rem; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4f46e5; }
    .error { color: #f87171; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Acceso al Portal de Pruebas</h2>
    <form id="login-form" onsubmit="handleLogin(event)">
      <label for="username">Usuario</label>
      <input type="text" id="username" data-testid="username-input" name="username" placeholder="Ingresa usuario" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" data-testid="password-input" name="password" placeholder="••••••••" required />

      <button type="submit" id="submit-btn" data-testid="login-submit-btn">Iniciar Sesión</button>
      <div id="error-msg" class="error">Credenciales incorrectas</div>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'admin_test' && p === 'secret123') {
        window.location.href = '/dashboard.html?user=' + encodeURIComponent(u);
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
