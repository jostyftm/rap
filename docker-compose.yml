services:
  laravel.test:
    build:
      context: ./docker/sail
      dockerfile: Dockerfile
    image: sail-8.4/app-rpa:latest
    container_name: rpa-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT}:80"
      - "${REVERB_SERVER_PORT}:8080"
    env_file:
      - .env
    volumes:
      - "./apps/api:/var/www/html"
      - "./docker/sail/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro"
    networks:
      - sail
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  pgsql:
    image: postgres:16-alpine
    container_name: rpa-pgsql
    ports:
      - "${FORWARD_DB_PORT}:5432"
    env_file:
      - .env
    volumes:
      - "rpa-pgsql-data:/var/lib/postgresql/data"
    networks:
      - sail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rpa-redis
    ports:
      - "${FORWARD_REDIS_PORT}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - "rpa-redis-data:/data"
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rpa-storage
    ports:
      - "${FORWARD_STORAGE_PORT}:9000"
      - "${FORWARD_STORAGE_CONSOLE_PORT}:9001"
    env_file:
      - .env
    volumes:
      - "rpa-storage-data:/data"
    networks:
      - sail
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/live || curl -f http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  sail:
    driver: bridge

volumes:
  rpa-pgsql-data:
    driver: local
  rpa-redis-data:
    driver: local
  rpa-storage-data:
    driver: local
