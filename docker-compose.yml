services:
  postgres:
    image: postgres:16-alpine
    container_name: rpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rpa_studio}
      POSTGRES_USER: ${DB_USERNAME:-rpa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rpa_user} -d ${DB_DATABASE:-rpa_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rpa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rpa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: rpa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-miniopassword};
      /usr/bin/mc mb --ignore-existing local/rpa-artifacts;
      /usr/bin/mc anonymous set download local/rpa-artifacts;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rpa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "RPA Studio"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9Zk=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-rpa_studio}
      DB_USERNAME: ${DB_USERNAME:-rpa_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-rpa-studio}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: rpa-artifacts
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    ports:
      - "8000:8000"

  reverb:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rpa-reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY:-base64:9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9Zk=}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-rpa-studio}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    ports:
      - "8080:8080"

  horizon:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: rpa-horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY:-base64:9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9ZlZk4Xv9Zk=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-rpa_studio}
      DB_USERNAME: ${DB_USERNAME:-rpa_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    container_name: rpa-runner
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      S3_BUCKET: rpa-artifacts

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: rpa-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-localhost}
      NEXT_PUBLIC_REVERB_PORT: "80"
      NEXT_PUBLIC_REVERB_SCHEME: "http"
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: rpa-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
      - reverb
    ports:
      - "80:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
